packages:
  - functions/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  netlify-cli: false
  sharp: false
  unix-dgram: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - 'fast-uri'
  - 'follow-redirects'
minimumReleaseAgeExcludePrune: true

overrides:
  # added 20260131
  'lodash': ^4.17.23
  # added 20260510
  'fast-uri': ^3.1.1
  # added 20261010
  'sharp': '>=0.35.0'
  # added 20261031
  'toml': '>=5.0.1'
  # added 20261101
  'follow-redirects': '^1.16.2'

saveExact: true

savePrefix: ''
